<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Health Radar</title>
<style>
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #17232f;
  --muted: #5d6c7b;
  --line: #d5dce3;
  --accent: #1d6f8c;
  --accent-soft: #dcecf2;
  --good: #2c7a57;
  --good-soft: #dff0e8;
  --warn: #9a6a12;
  --warn-soft: #f6ead0;
  --bad: #b23a3a;
  --bad-soft: #f6dddd;
  --side: #17232f;
  --side-ink: #d9e2ea;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11181f;
    --panel: #1a242e;
    --ink: #e6edf3;
    --muted: #9aabbb;
    --line: #2d3b49;
    --accent: #5db4d1;
    --accent-soft: #1f3a47;
    --good: #5fc596;
    --good-soft: #1b3a2d;
    --warn: #e0b44f;
    --warn-soft: #3d3216;
    --bad: #ee7b7b;
    --bad-soft: #3f2323;
    --side: #0b1117;
    --side-ink: #c4d0db;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  font-size: 15px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); padding: 24px 16px; position: sticky; top: 0; height: 100vh; }
.brand { font-size: 18px; font-weight: 700; letter-spacing: .2px; padding: 0 10px 4px; color: #fff; }
.brand-sub { font-size: 13px; padding: 0 10px 24px; color: var(--side-ink); opacity: .75; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button {
  background: none; border: 0; text-align: left; padding: 10px 12px; border-radius: 6px;
  color: var(--side-ink); font-size: 15px;
}
.nav button:hover { background: rgba(255,255,255,.07); }
.nav button[aria-current="page"] { background: var(--accent); color: #fff; font-weight: 600; }
.side-note { position: absolute; bottom: 20px; left: 16px; right: 16px; font-size: 12.5px; opacity: .7; }

main { padding: 28px 36px 60px; max-width: 1180px; width: 100%; }
h1 { font-size: 26px; margin: 0 0 4px; line-height: 1.2; }
h2 { font-size: 17px; margin: 0 0 12px; }
h3 { font-size: 15px; margin: 0 0 8px; }
.lede { color: var(--muted); margin: 0 0 24px; max-width: 70ch; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g2 { grid-template-columns: 1.5fr 1fr; }
.g2e { grid-template-columns: 1fr 1fr; }
.mb { margin-bottom: 16px; }

.kpi { padding: 16px 18px; }
.kpi .n { font-size: 30px; font-weight: 700; line-height: 1.1; }
.kpi .l { color: var(--muted); font-size: 13.5px; }
.kpi .d { font-size: 13px; margin-top: 6px; }
.up-bad { color: var(--bad); } .down-good { color: var(--good); }

.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--accent-soft); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 14px; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.back { background: none; border: 0; color: var(--accent); padding: 0; margin-bottom: 10px; font-size: 14px; text-decoration: underline; }

.healthbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 70px; }
.healthbar i { display: block; height: 100%; }
.bar-row { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; margin: 8px 0; font-size: 14px; }
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }

.botbox { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 16px 18px; background: var(--bg); font-size: 14px; }
.botbox ul { margin: 6px 0 10px 18px; padding: 0; }
.botbox li { margin: 4px 0; }
.check { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0; }
.check span.box { width: 15px; height: 15px; border: 2px solid var(--muted); border-radius: 3px; flex: none; margin-top: 3px; }
.check.on span.box { background: var(--warn); border-color: var(--warn); }

#radar svg { width: 100%; height: auto; display: block; }
#radar .pt { cursor: pointer; }
#radar .pt:hover circle { stroke-width: 3; }
#radar text { fill: var(--muted); font-size: 12px; font-family: inherit; }
#radar .lbl { fill: var(--ink); font-size: 12px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }

.note { background: var(--accent-soft); border-radius: 6px; padding: 10px 14px; font-size: 13.5px; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; padding: 14px; }
  .side-note { display: none; }
  .brand-sub { padding-bottom: 10px; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  main { padding: 20px 16px 48px; }
  .g4 { grid-template-columns: repeat(2, 1fr); }
  .g2, .g2e { grid-template-columns: 1fr; }
}
</style>
</head>

const $ = s => document.querySelector(s);
const healthColor = h => h >= 70 ? 'var(--good)' : h >= 50 ? 'var(--warn)' : 'var(--bad)';
const healthClass = h => h >= 70 ? 'good' : h >= 50 ? 'warn' : 'bad';
const levelClass = l => l === 'High' ? 'bad' : l === 'Medium' ? 'warn' : 'good';
const sevClass = s => s === 'Critical' || s === 'High' ? 'bad' : s === 'Medium' ? 'warn' : 'good';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);

let state = { view:'overview', repo:null, mr:null, mrFilter:'All', pr:null, prFilter:'All', jenkinsRepo:null };

function go(view, extra = {}) {
  state = Object.assign({}, state, { view, repo:null, mr:null, pr:null, jenkinsRepo:null }, extra);
  document.querySelectorAll('.nav button').forEach(b =>
    b.toggleAttribute('aria-current', b.dataset.view === (state.repo ? 'repos' : state.mr ? 'mrs' : state.pr ? 'prs' : state.jenkinsRepo ? 'jenkins' : view)));
  document.querySelectorAll('.nav button').forEach(b => {
    if (b.hasAttribute('aria-current')) b.setAttribute('aria-current', 'page');
  });
  render();
  window.scrollTo(0, 0);
}

      <div class="panel kpi"><div class="n" style="color:var(--bad)">${jenkinsJobs.filter(j=>j.status==='failing').length}</div><div class="l">CI pipelines failing</div><div class="d up-bad">needs immediate action</div></div>
      <div class="panel kpi"><div class="n">${prs.filter(p=>p.state==='Open').length}</div><div class="l">Open pull requests</div><div class="d up-bad">${prs.filter(p=>p.state==='Open'&&p.level==='High').length} high risk</div></div>

        <div class="legend"><span><b style="background:var(--good)"></b>Health 70+</span><span><b style="background:var(--warn)"></b>50 to 69</span><span><b style="background:var(--bad)"></b>Below 50</span><span>Bubble size: outdated dependencies</span></div>

            <td><strong>${r.id}</strong><div class="small muted">${r.vuln} vulnerable · bus factor ${r.bus}</div></td>

      </section>

function radarSVG() {
  const W = 620, H = 380, L = 56, R = 20, T = 20, B = 52;
  const px = b => L + ((b - 0.5) / 4) * (W - L - R);
  const py = v => H - B - (v / 9) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Risk map of repositories by bus factor and vulnerable dependencies">`;
  for (let v = 0; v <= 8; v += 2) s += `<line x1="${L}" x2="${W-R}" y1="${py(v)}" y2="${py(v)}" stroke="var(--line)"/><text x="${L-10}" y="${py(v)+4}" text-anchor="end">${v}</text>`;
  for (let b = 1; b <= 4; b++) s += `<text x="${px(b)}" y="${H-B+20}" text-anchor="middle">${b}</text>`;
  s += `<text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle">Bus factor (people who know the code)</text>`;
  s += `<text transform="translate(14 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">Vulnerable dependencies</text>`;
  s += `<rect x="${L}" y="${T}" width="${px(1.5)-L}" height="${py(3)-T}" fill="var(--bad-soft)" opacity=".55"/>`;
  const offsets = { 'payments-service':[0,-1], 'data-pipeline':[0,0], 'legacy-reports':[0,0], 'web-portal':[0,0], 'notif-service':[0,0] };
  repos.forEach(r => {
    const rad = 7 + Math.min(r.outdated, 32) * 0.45;
    let x = px(r.bus), y = py(r.vuln);
    if (r.id === 'payments-service') x -= 0; 
    if (r.id === 'data-pipeline') x += 0;
    s += `<g class="pt" tabindex="0" data-repo="${r.id}" role="button" aria-label="${r.id}, health ${r.health}">
      <circle cx="${x}" cy="${y}" r="${rad}" fill="${healthColor(r.health)}" fill-opacity=".8" stroke="var(--panel)" stroke-width="2"/>
      <text class="lbl" x="${x + rad + 5}" y="${y + 4}">${r.id}</text></g>`;
  });
  return s + '</svg>';
}

function suggest(m) {
  const r = repos.find(x => x.id === m.repo);
  const names = r.owners.map(o => o[0]).filter(n => n !== m.author && !n.startsWith('('));
  return names.slice(0,2).join(' and ') || 'No suggestion available';
}

function sheriffClass(s) { return s === 'approved' ? 'good' : s === 'flagged' ? 'warn' : s === 'blocked' ? 'bad' : 'info'; }
function sheriffLabel(p) {
  if (!p.sheriff.reviewed) return p.sheriff.status === 'blocked' ? '🚫 Blocked' : p.sheriff.uncaught.length ? '⚠ Flagged' : '⏳ Pending';
  return p.sheriff.uncaught.length ? '✓ Reviewed — warnings' : '✓ Approved';
}
function ciColor(s) { return s === 'passing' ? 'var(--good)' : s === 'failing' ? 'var(--bad)' : 'var(--warn)'; }
function ciClass(s) { return s === 'passing' ? 'good' : s === 'failing' ? 'bad' : 'warn'; }
function stageIcon(s) { return s === 'pass' ? '✓' : s === 'fail' ? '✕' : s === 'warn' ? '⚠' : '–'; }
function stageColor(s) { return s === 'pass' ? 'var(--good)' : s === 'fail' ? 'var(--bad)' : s === 'warn' ? 'var(--warn)' : 'var(--muted)'; }
function checkClass(s) { return s === 'passing' ? 'good' : s === 'failing' ? 'bad' : s === 'warning' ? 'warn' : 'info'; }

          <dt>Passing tests</dt><dd style="color:var(--good);font-weight:700">${j.passCount}</dd>
          <dt>Failing tests</dt><dd style="color:${j.failCount > 0 ? 'var(--bad)' : 'var(--good)'};font-weight:700">${j.failCount}</dd>
          <dt>Coverage</dt><dd>${j.coverage !== null ? `<div class="healthbar" style="width:120px;display:inline-block;vertical-align:middle;margin-right:8px"><i style="width:${j.coverage}%;background:${j.coverage >= 80 ? 'var(--good)' : j.coverage >= 60 ? 'var(--warn)' : 'var(--bad)'}"></i></div>${j.coverage}%` : '<span class="muted">Not configured</span>'}</dd>
          <dt>Trend</dt><dd>${j.trend === 'up' ? '<span style="color:var(--good)">↑ Improving</span>' : j.trend === 'down' ? '<span style="color:var(--bad)">↓ Degrading</span>' : '<span class="muted">→ Stable</span>'}</dd>
          <dt>Branch</dt><dd>${j.branch}</dd>
          <dt>Last run</dt><dd>${j.lastRun}</dd>
          <dt>Duration</dt><dd>${j.duration}</dd>
        </dl>
      </section>
    </div>`;
}

function viewPRs() {
  const f = state.prFilter || 'All';
  const list = prs.filter(p => f === 'All' || p.level === f || (f === 'Open' && p.state === 'Open') || (f === 'Failing' && p.checks.build === 'failing'));
  return `
    <h1>Pull requests</h1>
    <p class="lede">Every open and recently merged pull request with its risk score, CI check status and review coverage.</p>
    <div class="toolbar" role="group" aria-label="Filter pull requests">
      ${['All','Open','High','Medium','Low','Failing'].map(x => `<button class="chip" data-prfilter="${x}" aria-pressed="${f===x}">${x}</button>`).join('')}
    </div>
    <div class="panel tablewrap"><table>
      <thead><tr><th>Pull request</th><th>Repository</th><th>Author</th><th class="num">Files</th><th class="num">Size</th><th>Risk</th><th>Build</th><th>Tests</th><th class="num">Coverage</th><th>First review</th><th>Code Sheriff</th><th>Uncaught errors</th><th>State</th></tr></thead>
      <tbody>${list.map(p => `<tr class="click" tabindex="0" data-pr="${p.id}">
        <td><strong>#${p.id}</strong> ${esc(p.title)}</td>
        <td>${p.repo}</td>
        <td>${p.author}</td>
        <td class="num">${p.files}</td>
        <td class="num">+${p.add} −${p.del}</td>
        <td><span class="pill ${levelClass(p.level)}">${p.level} · ${p.score}</span></td>
        <td><span class="pill ${checkClass(p.checks.build)}">${p.checks.build}</span></td>
        <td><span class="pill ${checkClass(p.checks.tests)}">${p.checks.tests}</span></td>
        <td class="num small">${p.checks.coverage !== null ? p.checks.coverage + '%' : '<span class="muted">—</span>'}</td>
        <td>${p.firstReview === null ? '<span class="pill bad">None yet</span>' : p.firstReview + 'h'}</td>
        <td><span class="pill ${sheriffClass(p.sheriff.status)}">${sheriffLabel(p)}</span></td>
        <td class="small">${p.sheriff.uncaught.length ? `<span style="color:var(--bad);font-weight:600">${p.sheriff.uncaught.length} issue${p.sheriff.uncaught.length > 1 ? 's' : ''}</span>` : '<span class="muted">None</span>'}</td>
        <td>${p.state}</td>
      </tr>`).join('')}
      </tbody></table></div>`;
}

function viewPR(id) {
  const p = prs.find(x => x.id === id);
  if (!p) return '';
  return `
    <button class="back" data-back="prs">Back to pull requests</button>
    <h1>#${p.id} ${esc(p.title)}</h1>
    <p class="lede">${p.repo} · opened by ${p.author} ${p.age} ago · ${p.state}</p>
    <div class="grid g2e mb">
      <section class="panel"><h2>Report</h2>
        <dl class="kv">
          <dt>Risk</dt><dd><span class="pill ${levelClass(p.level)}">${p.level} · ${p.score}/100</span></dd>
          <dt>Author</dt><dd>${p.author}</dd>
          <dt>Reviewers</dt><dd>${p.reviewers.length ? p.reviewers.join(', ') : '<span class="pill bad">None assigned</span>'}</dd>
          <dt>Files changed</dt><dd>${p.files}</dd>
          <dt>Lines</dt><dd>+${p.add} −${p.del}</dd>
          <dt>First review</dt><dd>${p.firstReview === null ? 'Waiting' : p.firstReview + ' hours after opening'}</dd>
        </dl>
      </section>
      <section class="panel"><h2>CI checks</h2>
        <dl class="kv">
          <dt>Build</dt><dd><span class="pill ${checkClass(p.checks.build)}">${p.checks.build}</span></dd>
          <dt>Tests</dt><dd><span class="pill ${checkClass(p.checks.tests)}">${p.checks.tests}</span></dd>
          <dt>Lint</dt><dd><span class="pill ${checkClass(p.checks.lint)}">${p.checks.lint}</span></dd>
          <dt>Coverage</dt><dd>${p.checks.coverage !== null ? `<div class="healthbar" style="width:100px;display:inline-block;vertical-align:middle;margin-right:8px"><i style="width:${p.checks.coverage}%;background:${p.checks.coverage >= 80 ? 'var(--good)' : p.checks.coverage >= 60 ? 'var(--warn)' : 'var(--bad)'}"></i></div>${p.checks.coverage}%` : '<span class="muted">Not configured</span>'}</dd>
        </dl>
      </section>
    </div>
    <section class="panel mb" style="border-left: 4px solid ${p.sheriff.status === 'approved' && !p.sheriff.uncaught.length ? 'var(--good)' : p.sheriff.status === 'blocked' ? 'var(--bad)' : 'var(--warn)'}">
      <h2 style="display:flex;align-items:center;gap:10px">
        🔎 Code Sheriff
        <span class="pill ${sheriffClass(p.sheriff.status)}" style="font-size:13px">${sheriffLabel(p)}</span>
      </h2>
      <p class="small muted" style="margin-top:-6px">Automated review pass. Flags issues that passed CI but may still block safe merging.</p>
      ${p.sheriff.uncaught.length ? `
        <div style="margin-bottom:8px"><strong>Uncaught issues (${p.sheriff.uncaught.length})</strong></div>
        ${p.sheriff.uncaught.map(e => `
          <div style="display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:10px 12px;background:var(--bad-soft);border-radius:6px;border-left:3px solid var(--bad)">
            <span style="color:var(--bad);font-size:16px;flex:none">✕</span>
            <span style="font-size:14px">${esc(e)}</span>
          </div>`).join('')}
      ` : `
        <div style="display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--good-soft);border-radius:6px">
          <span style="color:var(--good);font-size:16px">✓</span>
          <span style="font-size:14px">No uncaught issues found. This pull request looks clean.</span>
        </div>
      `}
      ${!p.sheriff.reviewed ? `<p class="small muted" style="margin-top:10px">Sheriff review pending — automated scan only. A human review is still required before merge.</p>` : ''}
    </section>
    <div class="grid g2e mb">
      <section class="panel"><h2>Dependency changes</h2>
        ${p.deps.length ? `<table><tbody>${p.deps.map(d => `<tr><td><span class="pill info">${d[0]}</span></td><td><strong>${d[1]}</strong><div class="small muted">${d[2]}</div></td><td class="small">${d[3]}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">No dependency changes in this pull request.</p>'}
      </section>
      <section class="panel"><h2>Ownership notes</h2>
        ${p.notes.length ? `<ul style="margin:0;padding-left:18px">${p.notes.map(n => `<li style="margin:6px 0">${esc(n)}</li>`).join('')}</ul>` : '<p class="muted">No ownership concerns.</p>'}
      </section>
    </div>
    <section class="panel"><h2>Comment the bot posts on this pull request</h2>
      <div class="botbox">
        <strong>Code health check · ${p.level} risk (${p.score}/100)</strong>
        <div style="margin-top:8px"><em>Code Sheriff · ${sheriffLabel(p)}</em></div>
        <ul>${p.sheriff.uncaught.length ? p.sheriff.uncaught.map(e => `<li>${esc(e)}</li>`).join('') : '<li>No uncaught issues found</li>'}</ul>
        <div><em>CI status</em></div>
        <ul>
          <li>Build: ${p.checks.build}</li>
          <li>Tests: ${p.checks.tests}</li>
          <li>Lint: ${p.checks.lint}</li>
          ${p.checks.coverage !== null ? `<li>Coverage: ${p.checks.coverage}%</li>` : ''}
        </ul>
        <div><em>Dependency changes</em></div>
        <ul>${p.deps.length ? p.deps.map(d => `<li>${d[0]} <code>${d[1]}</code>: ${d[2]} (${d[3]})</li>`).join('') : '<li>None</li>'}</ul>
        <div><em>Code ownership and context</em></div>
        <ul>${p.notes.length ? p.notes.map(n => `<li>${esc(n)}</li>`).join('') : '<li>No concerns found</li>'}</ul>
        <div><em>Suggested reviewers</em></div>
        <ul><li>${suggestPR(p)}</li></ul>
        <div><em>Checklist</em></div>
        ${p.extra.length ? p.extra.map(e => `<div class="check on"><span class="box"></span><span>${e}</span></div>`).join('') : '<div class="check"><span class="box"></span><span>Standard review</span></div>'}
        <div class="small muted" style="margin-top:10px">Warn-only mode: this check does not block merging.</div>
      </div>
    </section>`;
}

function suggestPR(p) {
  const r = repos.find(x => x.id === p.repo);
  const names = r ? r.owners.map(o => o[0]).filter(n => n !== p.author && !n.startsWith('(')) : [];
  return names.slice(0,2).join(' and ') || 'No suggestion available';
}

/* ---------- Render + events ---------- */
function render() {
  let html;
  if (state.jenkinsRepo) html = viewJenkinsRepo(state.jenkinsRepo);
  else if (state.pr) html = viewPR(state.pr);
  else if (state.repo) html = viewRepo(state.repo);
  else if (state.mr) html = viewMR(state.mr);
  else if (state.view === 'repos') html = viewRepos();
  else if (state.view === 'mrs') html = viewMRs();
  else if (state.view === 'prs') html = viewPRs();
  else if (state.view === 'jenkins') html = viewJenkins();
  else if (state.view === 'people') html = viewPeople();
  else html = viewOverview();
  $('#main').innerHTML = html;
}

document.addEventListener('click', e => {
  const nav = e.target.closest('.nav button');
  if (nav) return go(nav.dataset.view);
  const back = e.target.closest('[data-back]');
  if (back) return go(back.dataset.back);
  const filt = e.target.closest('[data-filter]');
  if (filt) { state.mrFilter = filt.dataset.filter; return render(); }
  const prfilt = e.target.closest('[data-prfilter]');
  if (prfilt) { state.prFilter = prfilt.dataset.prfilter; return render(); }
  const r = e.target.closest('[data-repo]');
  if (r) return go('repos', { repo: r.dataset.repo });
  const m = e.target.closest('[data-mr]');
  if (m) return go('mrs', { mr: Number(m.dataset.mr) });
  const p = e.target.closest('[data-pr]');
  if (p) { state.pr = Number(p.dataset.pr); state.jenkinsRepo = null; return render(); }
  const j = e.target.closest('[data-jenkins]');
  if (j) { state.jenkinsRepo = j.dataset.jenkins; state.pr = null; return render(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest('[data-repo],[data-mr]');
  if (t && t.tagName !== 'BUTTON') { e.preventDefault(); t.click(); }
});

go('overview');
</script>
</body>
</html>
